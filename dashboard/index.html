<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAkGD Live Dashboard</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161922;
    --panel-2: #1c2030;
    --line: #262b3a;
    --text: #e6e8eb;
    --muted: #8c93a3;
    --good: #7ee787;
    --warn: #f0b860;
    --bad: #ff8a8a;
    --p1: #6aa8ff;
    --p1-bg: #182b4d;
    --p2: #c693ff;
    --p2-bg: #2a1f3a;
    --p0: #8c93a3;
    --p0-bg: #2a2e3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px 20px 60px;
    min-height: 100vh;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 4px;
           animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 4px 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .sumcell { display: flex; flex-direction: column; gap: 2px; }
  .sumcell .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .sumcell .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sumcell .val.good { color: var(--good); }
  .sumcell .val.muted { color: var(--muted); font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
  }
  .card.best { border-color: var(--good); box-shadow: 0 0 0 1px var(--good) inset; }
  .card.dead { opacity: 0.78; }
  .card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    transition: background 0.3s, color 0.3s;
  }
  .phase-0 { background: var(--p0-bg); color: var(--p0); }
  .phase-1 { background: var(--p1-bg); color: var(--p1); }
  .phase-2 { background: var(--p2-bg); color: var(--p2); }
  .phase-3 { background: #1f3a2a; color: var(--good); }
  .badge-dead { background: #3a1f1f; color: var(--bad); }
  .badge-alive { background: #1f3a2a; color: var(--good); }
  .badge-best  { background: #3a3120; color: var(--warn); }

  .stats {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr;
    gap: 4px 12px;
    font-size: 12px;
    align-items: baseline;
  }
  .stats .lbl { color: var(--muted); }
  .stats .val { font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; transition: color 0.3s; }
  .stats .val.best { color: var(--good); font-weight: 600; }

  /* Flash animation when a value changes */
  @keyframes flash-change {
    0%   { color: #fff; text-shadow: 0 0 6px rgba(126, 231, 135, 0.7); }
    100% { color: inherit; text-shadow: none; }
  }
  .val-changed {
    animation: flash-change 0.6s ease-out;
  }

  .progress {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    align-items: center;
  }
  .progress .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress .bar > div { height: 100%; transition: width 0.8s ease; border-radius: 3px; }
  .progress .end { font-variant-numeric: tabular-nums; color: var(--text); }

  svg.layout { width: 100%; height: 240px; background: #07090d; border-radius: 6px; }
  svg.layout line.e {
    stroke: #4a90e2; stroke-width: 0.8; stroke-opacity: 0.55; fill: none;
    transition: x1 0.8s ease, y1 0.8s ease, x2 0.8s ease, y2 0.8s ease;
  }
  svg.layout circle.n {
    fill: var(--good);
    transition: cx 0.8s ease, cy 0.8s ease;
  }
  /* Highlight nodes that moved significantly */
  @keyframes node-moved {
    0%   { fill: #fff; r: 4; }
    100% { fill: var(--good); }
  }
  svg.layout circle.n.moved {
    animation: node-moved 0.8s ease-out;
  }
  svg.layout .label { font-size: 9px; fill: var(--muted); }

  details.log { font-size: 11px; color: var(--muted); }
  details.log summary { cursor: pointer; padding: 2px 0; }

  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>SAkGD Live Dashboard</h1>
    <div class="meta" id="meta">…</div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"><div class="empty">Waiting for first status…</div></div>

<script>
const API_RUNS = "/api/runs";
const API_INFO = "/api/info";
const TICK_MS = 1000;
const SVG_NS = "http://www.w3.org/2000/svg";

// ─── Persistent card state ───────────────────────────────────────────
// Map from run.id → { card: DOM element, svgData: { lines, circles, prevPos }, refs: { stat elements } }
const cardMap = new Map();

function fmt(n, d = 0) {
  if (n === null || n === undefined || (typeof n === "number" && Number.isNaN(n))) return "—";
  if (typeof n !== "number") return String(n);
  if (d === 0) return Math.round(n).toLocaleString("en-US");
  return n.toLocaleString("en-US", { maximumFractionDigits: d });
}

function fmtSec(s) {
  if (s === null || s === undefined) return "—";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}m ${String(r).padStart(2, "0")}s`;
}

function tempPercent(d) {
  if (!d || !d.initT || !d.tempLimit || d.tempLimit <= 0) return 0;
  const lo = Math.log(d.tempLimit), hi = Math.log(d.initT);
  const cur = Math.log(Math.max(d.tempLimit, d.currentTemp || d.tempLimit));
  if (hi <= lo) return 0;
  return Math.max(0, Math.min(100, ((cur - lo) / (hi - lo)) * 100));
}

function phaseLabel(d) {
  if (!d) return "—";
  if (d.state === "done") return "Done";
  if (d.state === "starting") return "Warm-up";
  switch (d.phase) {
    case 0: return "Warm-up";
    case 1: return "Phase 1: crossing reduction";
    case 2: return "Phase 2: optimize k";
    case 3: return "Done";
    default: return "—";
  }
}

function phaseClass(d) {
  if (!d) return "phase-0";
  if (d.state === "done" || d.phase === 3) return "phase-3";
  return `phase-${d.phase || 0}`;
}

// ─── Update a text element, flash if changed ─────────────────────────
function updateText(el, newText) {
  if (!el) return;
  if (el.textContent !== newText) {
    el.textContent = newText;
    el.classList.remove("val-changed");
    // Force reflow to restart animation
    void el.offsetWidth;
    el.classList.add("val-changed");
  }
}

// ─── Incremental SVG layout update ───────────────────────────────────
function updateLayout(svgEl, d, svgState) {
  if (!d || !d.pos || !d.edges) return;
  const w = d.W || 1000, h = d.H || 1000;
  const ox = d.ox || 0, oy = d.oy || 0;
  const VW = 380, VH = 240, M = 4;
  const sx = (x) => M + ((x - ox) / Math.max(1, w)) * (VW - 2 * M);
  const sy = (y) => VH - M - ((y - oy) / Math.max(1, h)) * (VH - 2 * M);

  const numEdges = d.edges.length;
  const numNodes = d.pos.length;
  const r = numNodes > 200 ? 1.3 : (numNodes > 50 ? 1.8 : 2.4);

  // First render or structural change → full rebuild
  if (!svgState.initialized || svgState.numEdges !== numEdges || svgState.numNodes !== numNodes) {
    svgEl.innerHTML = "";
    svgState.lines = [];
    svgState.circles = [];

    // Create edge lines
    for (let i = 0; i < numEdges; i++) {
      const [u, v] = d.edges[i];
      const a = d.pos[u], b = d.pos[v];
      const line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("class", "e");
      if (a && b) {
        line.setAttribute("x1", sx(a[0]).toFixed(1));
        line.setAttribute("y1", sy(a[1]).toFixed(1));
        line.setAttribute("x2", sx(b[0]).toFixed(1));
        line.setAttribute("y2", sy(b[1]).toFixed(1));
      }
      svgEl.appendChild(line);
      svgState.lines.push(line);
    }

    // Create node circles
    for (let i = 0; i < numNodes; i++) {
      const p = d.pos[i];
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("class", "n");
      circle.setAttribute("r", r);
      if (p) {
        circle.setAttribute("cx", sx(p[0]).toFixed(1));
        circle.setAttribute("cy", sy(p[1]).toFixed(1));
      }
      svgEl.appendChild(circle);
      svgState.circles.push(circle);
    }

    svgState.prevPos = d.pos.map(p => [...p]);
    svgState.numEdges = numEdges;
    svgState.numNodes = numNodes;
    svgState.initialized = true;
    return;
  }

  // Incremental update: just update attributes (CSS transitions handle animation)
  // Update edges
  for (let i = 0; i < numEdges; i++) {
    const [u, v] = d.edges[i];
    const a = d.pos[u], b = d.pos[v];
    const line = svgState.lines[i];
    if (a && b && line) {
      line.setAttribute("x1", sx(a[0]).toFixed(1));
      line.setAttribute("y1", sy(a[1]).toFixed(1));
      line.setAttribute("x2", sx(b[0]).toFixed(1));
      line.setAttribute("y2", sy(b[1]).toFixed(1));
    }
  }

  // Update nodes, mark moved ones
  const moveThreshold = 2; // pixels threshold to consider "moved"
  for (let i = 0; i < numNodes; i++) {
    const p = d.pos[i];
    const circle = svgState.circles[i];
    if (!p || !circle) continue;

    const newCx = sx(p[0]);
    const newCy = sy(p[1]);
    const oldCx = parseFloat(circle.getAttribute("cx")) || 0;
    const oldCy = parseFloat(circle.getAttribute("cy")) || 0;
    const dist = Math.hypot(newCx - oldCx, newCy - oldCy);

    circle.setAttribute("cx", newCx.toFixed(1));
    circle.setAttribute("cy", newCy.toFixed(1));

    if (dist > moveThreshold) {
      circle.classList.remove("moved");
      void circle.offsetWidth;
      circle.classList.add("moved");
    }
  }

  svgState.prevPos = d.pos.map(p => [...p]);
}

// ─── Create a card DOM skeleton ──────────────────────────────────────
function createCard(run) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = run.id;

  card.innerHTML = `
    <div class="card-header">
      <span class="card-title">${run.id}</span>
      <span class="badge phase-badge phase-0" data-ref="phaseBadge">—</span>
      <span class="badge" data-ref="aliveBadge"></span>
      <span class="badge badge-best" data-ref="bestBadge" style="display:none">best</span>
    </div>
    <div class="stats">
      <span class="lbl">k</span>          <span class="val" data-ref="k">—</span>
      <span class="lbl">best k</span>   <span class="val best" data-ref="bestK">—</span>
      <span class="lbl">total crossings</span> <span class="val" data-ref="totalX">—</span>
      <span class="lbl">best total</span> <span class="val best" data-ref="bestX">—</span>
      <span class="lbl">moves</span>    <span class="val" data-ref="moves">—</span>
      <span class="lbl">accept rate</span> <span class="val" data-ref="acceptRate">—</span>
      <span class="lbl">temperature</span>     <span class="val" data-ref="currentTemp">—</span>
      <span class="lbl">limit</span>      <span class="val" data-ref="tempLimit">—</span>
    </div>
    <div class="progress" title="phase time">
      <span>phase</span>
      <div class="bar"><div data-ref="timeBar" style="width:0%; background:var(--good);"></div></div>
      <span class="end" data-ref="timeLabel">—</span>
    </div>
    <div class="progress" title="temperature (log scale)">
      <span>temperature</span>
      <div class="bar"><div data-ref="tempBar" style="width:0%; background:var(--p1);"></div></div>
      <span class="end">log T</span>
    </div>
  `;

  // Create the SVG element properly
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "layout");
  svg.setAttribute("viewBox", "0 0 380 240");
  svg.setAttribute("preserveAspectRatio", "none");
  card.appendChild(svg);

  // Cache references to frequently updated elements
  const refs = {};
  card.querySelectorAll("[data-ref]").forEach(el => {
    refs[el.dataset.ref] = el;
  });
  refs.svg = svg;

  return { card, refs, svgState: { initialized: false, lines: [], circles: [], prevPos: [], numEdges: 0, numNodes: 0 } };
}

// ─── Update an existing card with new data ───────────────────────────
function updateCard(entry, run, isGlobalBest) {
  const { card, refs, svgState } = entry;
  const d = run.data;
  const dead = !run.alive;

  // Update card classes
  card.classList.toggle("best", isGlobalBest);
  card.classList.toggle("dead", dead);

  // Phase badge
  const ph = phaseLabel(d);
  const phCls = phaseClass(d);
  const phaseBadge = refs.phaseBadge;
  if (phaseBadge) {
    phaseBadge.textContent = ph;
    // Update phase class
    phaseBadge.className = `badge phase-badge ${phCls}`;
  }

  // Alive badge
  const aliveBadge = refs.aliveBadge;
  if (aliveBadge) {
    if (dead) {
      aliveBadge.className = "badge badge-dead";
      aliveBadge.innerHTML = `exit: ${run.exit_code ?? "?"}`;
    } else {
      aliveBadge.className = "badge badge-alive";
      aliveBadge.innerHTML = `<span class="pulse"></span>running`;
    }
  }

  // Best badge visibility
  if (refs.bestBadge) {
    refs.bestBadge.style.display = isGlobalBest ? "" : "none";
  }

  // Stats
  updateText(refs.k, d ? fmt(d.k) : "—");
  updateText(refs.bestK, d && d.bestK >= 0 ? fmt(d.bestK) : "—");
  updateText(refs.totalX, d ? fmt(d.totalX) : "—");
  updateText(refs.bestX, d && d.bestX >= 0 ? fmt(d.bestX) : "—");
  updateText(refs.moves, d ? fmt(d.moves) : "—");
  updateText(refs.acceptRate, d && d.moves ? fmt((d.accepts / d.moves) * 100, 1) + "%" : "—");
  updateText(refs.currentTemp, d ? fmt(d.currentTemp, 4) : "—");
  updateText(refs.tempLimit, d ? fmt(d.tempLimit, 3) : "—");

  // Progress bars
  const timePct = d ? Math.min(100, ((d.phaseElapsedSec || 0) / Math.max(1, d.phaseBudgetSec || 1)) * 100) : 0;
  if (refs.timeBar) refs.timeBar.style.width = `${timePct.toFixed(1)}%`;
  updateText(refs.timeLabel, `${fmtSec(d?.phaseElapsedSec)} / ${fmtSec(d?.phaseBudgetSec)}`);

  const tempPct = tempPercent(d);
  const tempColor = d && d.phase === 1 ? "var(--p1)" : "var(--p2)";
  if (refs.tempBar) {
    refs.tempBar.style.width = `${tempPct.toFixed(1)}%`;
    refs.tempBar.style.background = tempColor;
  }

  // SVG layout — incremental update
  updateLayout(refs.svg, d, svgState);
}

// ─── Main tick ───────────────────────────────────────────────────────
let firstLoad = true;

async function tick() {
  let runs = [];
  let info = null;
  try {
    [runs, info] = await Promise.all([
      fetch(API_RUNS, { cache: "no-store" }).then((r) => r.json()),
      fetch(API_INFO, { cache: "no-store" }).then((r) => r.json()).catch(() => null),
    ]);
  } catch (e) {
    document.getElementById("meta").textContent = "server not responding";
    return;
  }

  // Aggregate.
  let alive = 0;
  let totalMoves = 0;
  let totalAccepts = 0;
  let bestK = Infinity, bestX = Infinity, bestId = "—";
  for (const r of runs) {
    if (r.alive) alive += 1;
    if (r.data) {
      totalMoves += r.data.moves || 0;
      totalAccepts += r.data.accepts || 0;
      const bk = r.data.bestK ?? -1;
      const bx = r.data.bestX ?? -1;
      if (bk >= 0 && (bk < bestK || (bk === bestK && bx < bestX))) {
        bestK = bk; bestX = bx; bestId = r.id;
      }
    }
  }

  // Header / summary.
  document.getElementById("meta").textContent =
    (info ? `input: ${info.input}  •  ` : "") +
    `${runs.length} ${runs.length === 1 ? "run" : "runs"}  •  updated: ${new Date().toLocaleTimeString()}`;

  const summary = document.getElementById("summary");
  const acceptRate = totalMoves > 0 ? (totalAccepts / totalMoves) * 100 : 0;
  summary.innerHTML = `
    <div class="sumcell">
      <span class="lbl">active</span>
      <span class="val">${alive} / ${runs.length}</span>
    </div>
    <div class="sumcell">
      <span class="lbl">best k</span>
      <span class="val good">${bestK === Infinity ? "—" : fmt(bestK)}</span>
    </div>
    <div class="sumcell">
      <span class="lbl">best total crossings</span>
      <span class="val good">${bestX === Infinity ? "—" : fmt(bestX)}</span>
    </div>
    <div class="sumcell">
      <span class="lbl">best run</span>
      <span class="val muted">${bestId}</span>
    </div>
    <div class="sumcell">
      <span class="lbl">total moves</span>
      <span class="val">${fmt(totalMoves)}</span>
    </div>
    <div class="sumcell">
      <span class="lbl">total accept rate</span>
      <span class="val">${fmt(acceptRate, 1)}%</span>
    </div>
  `;

  // Cards — incremental update.
  const grid = document.getElementById("grid");
  if (runs.length === 0) {
    grid.innerHTML = `<div class="empty">No active runs.</div>`;
    cardMap.clear();
    return;
  }

  // Remove the "waiting" placeholder if present
  if (firstLoad) {
    grid.innerHTML = "";
    firstLoad = false;
  }

  // Track which IDs are still active
  const activeIds = new Set();

  for (const r of runs) {
    activeIds.add(r.id);
    const isBest = bestId === r.id && r.data && r.data.bestK >= 0;

    if (cardMap.has(r.id)) {
      // Update existing card
      updateCard(cardMap.get(r.id), r, isBest);
    } else {
      // Create new card
      const entry = createCard(r);
      cardMap.set(r.id, entry);
      grid.appendChild(entry.card);
      updateCard(entry, r, isBest);
    }
  }

  // Remove cards for runs that no longer exist
  for (const [id, entry] of cardMap) {
    if (!activeIds.has(id)) {
      entry.card.remove();
      cardMap.delete(id);
    }
  }
}

setInterval(tick, TICK_MS);
tick();
</script>
</body>
</html>
